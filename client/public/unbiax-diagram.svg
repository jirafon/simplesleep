<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="white"/>
  
  <!-- Central Unbiax Logo and Text -->
  <g transform="translate(300, 200)">
    <!-- Logo (abstract X/star) -->
    <g fill="#1e40af">
      <path d="M-20,-20 L-8,-8 L-20,4 L-8,16 L-4,12 L-12,4 L-4,-4 L-12,-12 Z"/>
      <path d="M20,-20 L8,-8 L20,4 L8,16 L4,12 L12,4 L4,-4 L12,-12 Z"/>
      <path d="M-20,20 L-8,8 L-20,-4 L-8,-16 L-4,-12 L-12,-4 L-4,4 L-12,12 Z"/>
      <path d="M20,20 L8,8 L20,-4 L8,-16 L4,-12 L12,-4 L4,4 L12,12 Z"/>
    </g>
    
    <!-- Unbiax Text -->
    <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a">Unbiax</text>
  </g>
  
  <!-- Spinoffs around the circle -->
  <!-- Privax (top) -->
  <circle cx="300" cy="80" r="4" fill="#1e40af"/>
  <text x="300" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Privax</text>
  
  <!-- Smartrisk (top-right) -->
  <circle cx="420" cy="120" r="4" fill="#1e40af"/>
  <text x="420" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Smartrisk</text>
  
  <!-- Eticpro (right) -->
  <circle cx="450" cy="200" r="4" fill="#1e40af"/>
  <text x="450" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Eticpro</text>
  
  <!-- CyberRisk360 (right-bottom) -->
  <circle cx="420" cy="280" r="4" fill="#1e40af"/>
  <text x="420" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">CyberRisk360</text>
  
  <!-- Automatix (bottom) -->
  <circle cx="300" cy="320" r="4" fill="#1e40af"/>
  <text x="300" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Automatix</text>
  
  <!-- InsightX (bottom-left) -->
  <circle cx="180" cy="280" r="4" fill="#1e40af"/>
  <text x="180" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">InsightX</text>
  
  <!-- Vizora (left) -->
  <circle cx="150" cy="200" r="4" fill="#1e40af"/>
  <text x="150" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Vizora</text>
  
  <!-- LMS (top-left) -->
  <circle cx="180" cy="120" r="4" fill="#1e40af"/>
  <text x="180" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">LMS</text>
  
  <!-- Batonpass (left-top) -->
  <circle cx="120" cy="160" r="4" fill="#1e40af"/>
  <text x="120" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Batonpass</text>
  
  <!-- Connection lines -->
  <g stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.3">
    <line x1="300" y1="200" x2="300" y2="84"/>
    <line x1="300" y1="200" x2="424" y2="124"/>
    <line x1="300" y1="200" x2="454" y2="204"/>
    <line x1="300" y1="200" x2="424" y2="284"/>
    <line x1="300" y1="200" x2="300" y2="324"/>
    <line x1="300" y1="200" x2="184" y2="284"/>
    <line x1="300" y1="200" x2="154" y2="204"/>
    <line x1="300" y1="200" x2="184" y2="124"/>
    <line x1="300" y1="200" x2="124" y2="164"/>
  </g>
</svg> 